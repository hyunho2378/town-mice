<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>화천 Town MICE PASS</title>

    <!-- Pretendard 실제 로드 (font-family 선언만으로는 적용되지 않음) -->
    <link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

    <!-- 토큰: 색, 타이포, 간격, 반경, 그림자, 모션의 단일 출처. Tailwind CDN보다 먼저 로드한다 -->
    <script src="./js/tokens.js"></script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind 설정을 tokens.js 값으로만 구성한다. 여기 직접 hex를 적지 않는다.
      // borderRadius와 boxShadow는 extend가 아니라 theme을 통째로 교체한다(UI_DESIGN_SYSTEM_
      // PLAYBOOK.md §1.1). 그래야 rounded-2xl처럼 5단계 밖의 클래스를 실수로 써도 카드 반경(12)
      // 으로 흡수되어 화면이 깨지지 않는다.
      tailwind.config = {
        theme: {
          borderRadius: {
            none: radius.none + "px",
            DEFAULT: radius.sm + "px",
            sm: radius.sm + "px",
            md: radius.md + "px",
            lg: radius.md + "px",
            xl: radius.lg + "px",
            "2xl": radius.lg + "px",
            "3xl": radius.lg + "px",
            full: radius.full + "px",
          },
          boxShadow: {
            none: "none",
            sm: shadow.sm,
            DEFAULT: shadow.sm,
            md: shadow.md,
            lg: shadow.lg,
            xl: shadow.lg,
            "2xl": shadow.lg,
            inner: shadow.inset,
            card: shadow.md,
            nav: shadow.navTop,
            frame: shadow.frame,
          },
          extend: {
            colors: {
              shell: colors.shell,
              "shell-pressed": colors.shellPressed,
              primary: colors.primary,
              "primary-pressed": colors.primaryPressed,
              "primary-subtle": colors.primarySubtle,
              "ci-green": colors.ciGreen,
              "ci-green-subtle": colors.ciGreenSubtle,
              "ci-green-ink": colors.ciGreenInk,
              "ci-orange": colors.ciOrange,
              "ci-orange-subtle": colors.ciOrangeSubtle,
              "ci-orange-ink": colors.ciOrangeInk,
              "ci-blue-subtle": colors.ciBlueSubtle,
              "ci-blue-ink": colors.ciBlueInk,
              "text-primary": colors.textPrimary,
              "text-secondary": colors.textSecondary,
              "text-tertiary": colors.textTertiary,
              "on-primary": colors.textOnPrimary,
              "text-danger": colors.textDanger,
              scrim: colors.scrim,
              surface: colors.surface,
              "surface-raised": colors.surfaceRaised,
              "surface-sunken": colors.surfaceSunken,
              "surface-inverse": colors.surfaceInverse,
              background: colors.background,
              border: colors.border,
              "border-strong": colors.borderStrong,
              success: colors.success,
              "success-soft": colors.successSoft,
              danger: colors.danger,
              "danger-soft": colors.dangerSoft,
            },
            fontFamily: { sans: fonts.sans.split(", ") },
            zIndex: { sticky: String(zIndex.stickyHeader), modal: String(zIndex.modal) },
          },
        },
      };

      // 타이포 역할(크기+굵기+행간+자간 한 세트)은 Tailwind fontSize 튜플이 굵기를 못 담아서
      // 별도 CSS 클래스로 만든다. text-title-lg 같은 클래스는 페이지에서 font-bold 등으로
      // 덮어쓰지 않는다(굵게 보여야 하면 역할을 올린다).
      (function injectTypographyClasses() {
        const roleToClass = {
          displayLg: "text-display-lg",
          titleLg: "text-title-lg",
          titleMd: "text-title-md",
          titleSm: "text-title-sm",
          bodyLg: "text-body-lg",
          bodyMd: "text-body-md",
          labelLg: "text-label-lg",
          labelMd: "text-label-md",
          labelSm: "text-label-sm",
          captionMd: "text-caption-md",
          captionSm: "text-caption-sm",
        };
        let css = "";
        for (const key in roleToClass) {
          const t = typography[key];
          css += "." + roleToClass[key] + " { font-size: " + t.size + "px; font-weight: " + t.weight +
            "; line-height: " + t.leading + "; letter-spacing: " + t.tracking + "; }\n";
        }
        const styleEl = document.createElement("style");
        styleEl.setAttribute("data-source", "tokens.typography");
        styleEl.textContent = css;
        document.head.appendChild(styleEl);
      })();

      // 나머지 전역 CSS가 참조하는 CSS 변수도 여기서 채운다.
      document.documentElement.style.setProperty("--color-background", colors.background);
      document.documentElement.style.setProperty("--color-border", colors.border);
      document.documentElement.style.setProperty("--color-primary", colors.primary);
      document.documentElement.style.setProperty("--color-shell", colors.shell);
      document.documentElement.style.setProperty("--color-surface-sunken", colors.surfaceSunken);
      document.documentElement.style.setProperty("--shadow-frame", shadow.frame);
      document.documentElement.style.setProperty("--shadow-inset", shadow.inset);
      document.documentElement.style.setProperty("--press-scale", String(motion.pressScale));
      document.documentElement.style.setProperty("--motion-fast", motion.duration.fast + "ms");
      document.documentElement.style.setProperty("--motion-base", motion.duration.base + "ms");
      document.documentElement.style.setProperty("--motion-standard", motion.easing.standard);
    </script>

    <style>
      html, body, #root { height: 100%; background: var(--color-background); }
      body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", "Pretendard", system-ui, sans-serif; }

      .phone-frame {
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--color-background);
        box-shadow: var(--shadow-frame);
        position: relative;
      }

      /* 44px 미만 터치 타깃을 시각적으로는 작게 두되 히트 영역만 넓히고 싶을 때 쓰는 유틸 */
      .tap-target-44 {
        min-width: 44px;
        min-height: 44px;
      }

      /* press 피드백: transform만 사용, scale(0.97)이 표준값(스킬 절대 규칙) */
      .press {
        transition: transform var(--motion-fast) var(--motion-standard);
      }
      .press:active {
        transform: scale(var(--press-scale));
      }

      /* 오목한 안쪽 느낌(이너 섀도). 진행률 트랙, 입력칸처럼 눌려 있는 표면에 쓴다 */
      .inset-well {
        box-shadow: var(--shadow-inset);
        background: var(--color-surface-sunken);
      }

      /* 캐러셀, 로딩: opacity와 transform만 쓴다 */
      @keyframes slideIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
      .slide-in { animation: slideIn var(--motion-base) var(--motion-standard); }
      @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
      .sheet-up { animation: sheetUp 240ms var(--motion-standard); }

      /* 키보드 포커스 가시성 */
      a:focus-visible, button:focus-visible, input:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }

      /* 접근성 3종 대응 */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
      @media (prefers-contrast: more) {
        .phone-frame { box-shadow: none; border: 1px solid var(--color-border); }
      }
      @media (prefers-reduced-transparency: reduce) {
        .backdrop-blur { backdrop-filter: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // 빌드 도구 없이 브라우저에서 직접 JSX를 읽어 실행한다.
      // const/let 최상위 선언이 개별 eval 사이에서 공유되지 않아 전부 합쳐 한 번에 eval한다.
      // tokens.js는 위에서 이미 순수 스크립트로 로드했으므로 이 목록에는 넣지 않는다.
      // 순서 중요: data -> state -> components -> pages -> app
      (async function boot() {
        const files = ["./js/data.js", "./js/state.js", "./js/components.js", "./js/pages.js", "./js/app.js"];
        try {
          const parts = [];
          for (const f of files) {
            const res = await fetch(f + "?t=" + Date.now());
            if (!res.ok) throw new Error("파일을 불러오지 못했습니다: " + f);
            const code = await res.text();
            const transformed = Babel.transform(code, { presets: ["react"], filename: f }).code;
            parts.push("// ===== " + f + " =====\n" + transformed);
          }
          const combined = parts.join("\n\n");
          (0, eval)(combined);
        } catch (e) {
          console.error("실행 오류:", e);
          document.getElementById("root").innerHTML =
            '<pre style="color:red;padding:16px;white-space:pre-wrap">' + (e.stack || e.message) + "</pre>";
        }
      })();
    </script>
  </body>
</html>
