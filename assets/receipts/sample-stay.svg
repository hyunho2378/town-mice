<svg xmlns="http://www.w3.org/2000/svg" width="400" height="680" viewBox="0 0 400 680" role="img"><title>화천 산천어펜션 2박 시연용 영수증</title><g font-family="Pretendard, Apple SD Gothic Neo, sans-serif"><path fill="#F8F4E9" d="M0 0H400V668l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8l-8 8 -8 -8Z"/><text x="200" y="36" font-size="11" font-weight="700" text-anchor="middle" fill="#646B71">TOWN MICE / DEMO RECEIPT</text><text x="200" y="79" font-size="24" font-weight="800" text-anchor="middle" fill="#242C35">화천 산천어펜션</text><text x="200" y="107" font-size="14" font-weight="600" text-anchor="middle" fill="#242C35">거래 영수증</text><rect x="120" y="124" width="160" height="26" rx="3" fill="none" stroke="#A23F32"/><text x="200" y="142" font-size="11" font-weight="700" text-anchor="middle" fill="#A23F32">시연용 / 결제 효력 없음</text><path d="M32 172H368" stroke="#C5C1B7" stroke-dasharray="4 4"/><text x="32" y="198" font-size="11" font-weight="500" text-anchor="start" fill="#646B71">거래번호</text><text x="368" y="198" font-size="14" font-weight="600" text-anchor="end" fill="#242C35">DEMO-HC-01</text><text x="32" y="224" font-size="11" font-weight="500" text-anchor="start" fill="#646B71">결제일시</text><text x="368" y="224" font-size="14" font-weight="600" text-anchor="end" fill="#242C35">2027.01.16 14:32</text><text x="32" y="250" font-size="11" font-weight="500" text-anchor="start" fill="#646B71">가맹점 주소 (가상)</text><text x="32" y="276" font-size="14" font-weight="500" text-anchor="start" fill="#242C35">강원특별자치도 화천군 하남면</text><text x="32" y="299" font-size="11" font-weight="500" text-anchor="start" fill="#646B71">상세주소 및 사업자번호는 시연에서 생략</text><path d="M32 318H368" stroke="#C5C1B7" stroke-dasharray="4 4"/><text x="32" y="344" font-size="11" font-weight="600" text-anchor="start" fill="#646B71">품목 / 수량</text><text x="368" y="344" font-size="11" font-weight="600" text-anchor="end" fill="#646B71">금액</text><text x="32" y="375" font-size="14" font-weight="700" text-anchor="start" fill="#242C35">객실 1실 / 2박</text><text x="368" y="375" font-size="14" font-weight="700" text-anchor="end" fill="#242C35">400,000</text><text x="32" y="398" font-size="11" font-weight="500" text-anchor="start" fill="#646B71">200,000 × 2</text><path d="M32 421H368" stroke="#C5C1B7" stroke-dasharray="4 4"/><text x="32" y="457" font-size="14" font-weight="800" text-anchor="start" fill="#242C35">합계</text><text x="368" y="460" font-size="30" font-weight="800" text-anchor="end" fill="#242C35">400,000원</text><text x="32" y="491" font-size="11" font-weight="500" text-anchor="start" fill="#646B71">결제수단</text><text x="368" y="491" font-size="14" font-weight="500" text-anchor="end" fill="#242C35">카드 결제 (시뮬레이션)</text><path d="M32 514H368" stroke="#C5C1B7" stroke-dasharray="4 4"/><g transform="translate(289 534) rotate(-7 32 25)"><rect width="68" height="48" rx="3" fill="none" stroke="#A23F32" stroke-width="2"/><text x="34" y="20" font-size="14" font-weight="800" text-anchor="middle" fill="#A23F32">시연용</text><text x="34" y="37" font-size="11" font-weight="700" text-anchor="middle" fill="#A23F32">SAMPLE</text></g><text x="32" y="546" font-size="14" font-weight="700" text-anchor="start" fill="#242C35">겨울 영수증, 여름 화천</text><text x="32" y="568" font-size="11" font-weight="500" text-anchor="start" fill="#646B71">영수증은 버리지 마세요.</text><text x="200" y="616" font-size="11" font-weight="600" text-anchor="middle" fill="#646B71">상호와 거래 내역은 모두 가상입니다.</text><text x="200" y="636" font-size="11" font-weight="500" text-anchor="middle" fill="#646B71">실제 결제, 세무, 환급 증빙으로 사용할 수 없습니다.</text></g></svg>